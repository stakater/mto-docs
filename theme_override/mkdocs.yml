              - Installation: "getting-started/installation/aws-eks/installation.md"
              - Validation: "getting-started/installation/aws-eks/validation.md"
      - getting-started/uninstalling.md
  # The five capability pillars. Each is Overview / Concepts / Guides; the
  # Concepts and Guides sections of Templates, FinOps and Hibernation are
  # populated from the sub-operator repos at build time (see merge.yaml).
  - Multi-Tenancy:
      - Overview: multi-tenancy/overview.md
      - Concepts:
          - multi-tenancy/concepts/tenant.md
          - multi-tenancy/concepts/quota.md
          - multi-tenancy/concepts/integration-config.md
      - Guides:
          - multi-tenancy/guides/create-tenant.md
          - multi-tenancy/guides/create-namespaces.md
          - multi-tenancy/guides/create-sandbox.md
          - multi-tenancy/guides/assign-metadata.md
          - multi-tenancy/guides/templated-metadata-values.md
          - multi-tenancy/guides/custom-roles.md
          - multi-tenancy/guides/extend-default-roles.md
          - multi-tenancy/guides/storage-classes.md
          - multi-tenancy/guides/pod-priority-classes.md
          - multi-tenancy/guides/service-accounts.md
          - multi-tenancy/guides/image-registries.md
          - multi-tenancy/guides/host-validation.md
          - multi-tenancy/guides/ingress-sharding.md
          - multi-tenancy/guides/disable-intra-tenant-networking.md
