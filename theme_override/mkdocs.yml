site_name: Multi-Tenant Operator
docs_dir: content
site_url: https://docs.stakater.com/mto/
repo_url: https://github.com/stakater/mto-docs
edit_uri: blob/main/content/
theme:
  favicon: assets/images/favicon.svg

strict: true

# MkDocs' default exclude_docs also drops a top-level `/templates/` directory,
# which is the Templates pillar here. Keep only the dotfile exclusion.
exclude_docs: |
  .*

validation:
  links:
    anchors: warn

extra:
  version:
    provider: mike
    default: latest

# Resolves {{ screenshot: <name> }} directives to the images captured by
# screenshots/capture.sh. Our own module, loaded by mkdocs' built-in hooks: key --
# no plugin to install, and it only touches that exact pattern (mkdocs-macros would
# enable Jinja2 on every page and try to evaluate the {{ .Role }} / {{ issuer }}
# templating examples in the integration docs).
hooks:
  - screenshots/mkdocs_hook.py

plugins:
  - search
  - glightbox
  # Redirects for pages relocated during the docs restructure, so old bookmarks
  # keep working. Requires the mkdocs-redirects package at build time, see
  # docs/superpowers/shared-theme-redirects.md (added to the shared theme's
  # requirements.txt).
  - redirects:
      redirect_maps:
        about/key-features.md: overview/key-features.md
        about/use-cases.md: overview/use-cases.md
        about/benefits.md: overview/why-mto.md
        overview/benefits.md: overview/why-mto.md
        architecture/architecture.md: overview/architecture.md
        architecture/concepts.md: overview/terminology.md
        kubernetes-resources/tenant/tenant-overview.md: multi-tenancy/concepts/tenant.md
        kubernetes-resources/quota.md: multi-tenancy/concepts/quota.md
        kubernetes-resources/extensions.md: extensions/concepts/extensions.md
        kubernetes-resources/integration-config.md: multi-tenancy/concepts/integration-config.md
        installation/overview.md: getting-started/installation/overview.md
        installation/openshift.md: getting-started/installation/openshift.md
        installation/kubernetes.md: getting-started/installation/kubernetes.md
        installation/azure-aks/preparation.md: getting-started/installation/azure-aks/preparation.md
        installation/azure-aks/installation.md: getting-started/installation/azure-aks/installation.md
        installation/azure-aks/validation.md: getting-started/installation/azure-aks/validation.md
        installation/aws-eks/preparation.md: getting-started/installation/aws-eks/preparation.md
        installation/aws-eks/installation.md: getting-started/installation/aws-eks/installation.md
        installation/aws-eks/validation.md: getting-started/installation/aws-eks/validation.md
        installation/uninstalling.md: getting-started/uninstalling.md
        cli/kubectl-plugin.md: cli/overview.md
        reference/cli.md: cli/overview.md
        kubernetes-resources/tenant/how-to-guides/create-tenant.md: multi-tenancy/guides/create-tenant.md
        kubernetes-resources/tenant/how-to-guides/create-namespaces.md: multi-tenancy/guides/create-namespaces.md
        kubernetes-resources/tenant/how-to-guides/create-sandbox.md: multi-tenancy/guides/create-sandbox.md
        kubernetes-resources/tenant/how-to-guides/assign-metadata.md: multi-tenancy/guides/assign-metadata.md
        kubernetes-resources/tenant/how-to-guides/hibernate-tenant.md: hibernation/guides/hibernate-tenant.md
        kubernetes-resources/tenant/how-to-guides/restrict-nodepool-per-tenant.md: multi-tenancy/guides/restrict-nodepool-per-tenant.md
        kubernetes-resources/tenant/how-to-guides/disable-intra-tenant-networking.md: multi-tenancy/guides/disable-intra-tenant-networking.md
        kubernetes-resources/tenant/how-to-guides/ingress-sharding.md: multi-tenancy/guides/ingress-sharding.md
        kubernetes-resources/tenant/how-to-guides/host-validation.md: multi-tenancy/guides/host-validation.md
        kubernetes-resources/tenant/how-to-guides/storage-classes.md: multi-tenancy/guides/storage-classes.md
        kubernetes-resources/tenant/how-to-guides/pod-priority-classes.md: multi-tenancy/guides/pod-priority-classes.md
        kubernetes-resources/tenant/how-to-guides/service-accounts.md: multi-tenancy/guides/service-accounts.md
        kubernetes-resources/tenant/how-to-guides/image-registries.md: multi-tenancy/guides/image-registries.md
        kubernetes-resources/tenant/how-to-guides/custom-roles.md: multi-tenancy/guides/custom-roles.md
        kubernetes-resources/tenant/how-to-guides/extend-default-roles.md: multi-tenancy/guides/extend-default-roles.md
        kubernetes-resources/tenant/how-to-guides/delete-tenant.md: multi-tenancy/guides/delete-tenant.md
        kubernetes-resources/tenant/how-to-guides/templated-metadata-values.md: multi-tenancy/guides/templated-metadata-values.md
        changelog.md: release-notes.md
        # Pillar restructure: flat Concepts/Guides/Integrations sections replaced
        # by per-pillar Overview / Concepts / Guides.
        concepts/architecture.md: overview/architecture.md
        concepts/terminology.md: overview/terminology.md
        concepts/tenant.md: multi-tenancy/concepts/tenant.md
        concepts/quota.md: multi-tenancy/concepts/quota.md
        concepts/integration-config.md: multi-tenancy/concepts/integration-config.md
        concepts/extensions.md: extensions/concepts/extensions.md
        guides/create-tenant.md: multi-tenancy/guides/create-tenant.md
        guides/create-namespaces.md: multi-tenancy/guides/create-namespaces.md
        guides/create-sandbox.md: multi-tenancy/guides/create-sandbox.md
        guides/assign-metadata.md: multi-tenancy/guides/assign-metadata.md
        guides/restrict-nodepool-per-tenant.md: multi-tenancy/guides/restrict-nodepool-per-tenant.md
        guides/disable-intra-tenant-networking.md: multi-tenancy/guides/disable-intra-tenant-networking.md
        guides/ingress-sharding.md: multi-tenancy/guides/ingress-sharding.md
        guides/host-validation.md: multi-tenancy/guides/host-validation.md
        guides/storage-classes.md: multi-tenancy/guides/storage-classes.md
        guides/pod-priority-classes.md: multi-tenancy/guides/pod-priority-classes.md
        guides/service-accounts.md: multi-tenancy/guides/service-accounts.md
        guides/image-registries.md: multi-tenancy/guides/image-registries.md
        guides/custom-roles.md: multi-tenancy/guides/custom-roles.md
        guides/extend-default-roles.md: multi-tenancy/guides/extend-default-roles.md
        guides/delete-tenant.md: multi-tenancy/guides/delete-tenant.md
        guides/templated-metadata-values.md: multi-tenancy/guides/templated-metadata-values.md
        guides/hibernate-tenant.md: hibernation/guides/hibernate-tenant.md
        integrations/argocd.md: extensions/guides/argocd.md
        integrations/vault/vault.md: extensions/guides/vault.md
        integrations/vault/vault-ic.md: extensions/guides/vault-ic.md
        integrations/vault/vault-kc-entraid.md: extensions/guides/vault-kc-entraid.md
        integrations/devworkspace.md: extensions/guides/devworkspace.md
        integrations/mattermost.md: extensions/guides/mattermost.md
        integrations/aws-pricing.md: finops/guides/aws-pricing.md
