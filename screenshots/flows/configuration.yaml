# console/configuration.md -> integrationConfig.png (Operator Settings, admin-only)
name: docs-configuration

requires:
  env: [CONSOLE_URL, CONSOLE_USER, CONSOLE_PASSWORD]
  reachable: ["${CONSOLE_URL}"]

viewport:
  width: 1280
  height: 800
  deviceScaleFactor: 2
  colorScheme: light

steps:
  - { step: open, url: "${CONSOLE_URL}" }
  - { step: wait-for, selector: 'input[name="login"], input[name="username"]', timeout: 60s }
  - { step: fill, selector: 'input[name="login"], input[name="username"]', value: "${CONSOLE_USER}" }
  - { step: fill, selector: 'input[name="password"]', value: "${CONSOLE_PASSWORD}" }
  # The click is instant; Playwright then waits for the Dex -> /auth/callback ->
  # dashboard redirect chain, which exceeds the 10s default on a cold Dex. The
  # wait-for below is the real gate, so a long timeout here only removes a false
  # failure.
  - { step: click, selector: 'button[type="submit"]', timeout: 60s }
  - { step: wait-for, selector: '[data-testid="dashboard-container"]', timeout: 60s }

  # Admin-gated route; CONSOLE_USER must be an admin
  - { step: open, url: "${CONSOLE_URL}/integration-config" }
  - { step: wait-for, selector: '[data-testid="integration-config-page"]', timeout: 30s }
  - { step: wait-for, selector: '[data-testid="integration-config-loading"]', state: detached, timeout: 30s }
  - { step: wait-for, selector: '[data-testid="integration-yaml-content"]', timeout: 30s }
  # YAML text itself loads async -- wait for actual content, not the container
  - { step: wait-for, selector: '[data-testid="integration-yaml-content"] >> text=apiVersion', timeout: 30s }
  - { step: screenshot, path: integrationConfig.png, fullPage: false }

after:
  - { step: screenshot, when: on-failure, path: _failure-configuration.png }
