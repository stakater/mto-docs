StylesPath = styles
MinAlertLevel = warning

Packages = https://github.com/stakater/vale-package/releases/download/v0.0.93/Stakater.zip
Vocab = Stakater

# Only check MarkDown files
[*.md]

BasedOnStyles = Vale

# {{ screenshot: <name> }} directives resolve to an image at build time and never
# reach the reader. The name is a filename, so spelling and term rules don't apply.
TokenIgnores = (\{\{\s*screenshot:[^}]*\}\})
