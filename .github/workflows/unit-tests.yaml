name: Unit tests

on:
  pull_request:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make test
