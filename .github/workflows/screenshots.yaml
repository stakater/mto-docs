name: Screenshots

# Captures the MTO Console screenshots and commits them, so no docs build has to
# reach the live console.
on:
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    # The label forces a capture; approval only captures if none has happened yet.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event_name == 'pull_request' &&
         github.event.label.name == 'screenshots') ||
        (github.event_name == 'pull_request_review' &&
         github.event.review.state == 'approved' &&
         !contains(github.event.pull_request.labels.*.name, 'screenshots-captured'))))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout the branch being captured for
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          # PUBLISH_TOKEN rather than GITHUB_TOKEN: the commit below has to
          # trigger the docs build, and GITHUB_TOKEN pushes never do.
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: stakater-user
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Capture
        env:
          CONSOLE_USER: ${{ secrets.CONSOLE_USER }}
          CONSOLE_PASSWORD: ${{ secrets.CONSOLE_PASSWORD }}
        run: |
          printf 'CONSOLE_USER=%s\nCONSOLE_PASSWORD=%s\n' \
            "$CONSOLE_USER" "$CONSOLE_PASSWORD" > screenshots/.env
          bash screenshots/capture.sh

      - name: Check every directive resolves
        run: python3 screenshots/inject.py --check

      - name: Commit the new images
        run: |
          git config user.email "stakater@gmail.com"
          git config user.name "stakater-user"
          git add screenshots/captured
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -m "chore: refresh console screenshots"
          git push

      # So approval and the push build skip capturing what this run already did.
      # The `screenshots` label comes off, so it can be added again to force another.
      - name: Label the PR as captured
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --add-label screenshots-captured --remove-label screenshots
