# Controls which sub-operator docs are merged into mto-docs at build time.
# `repo` is the canonical source (git URL); the pipeline clones it and the
# merge runs against the clone via --set-repo. Locally, override with --set-repo
# (see the Makefile) to point at a local checkout.
#
# mto-docs now follows the shared structure (structure.md), so `into`/`under`
# map 1:1 to the shared sections (guides->Guides, reference->Reference, ...).
#
# Duplicate pages (same filename from mto-docs + a sub-operator, or across
# sub-operators) under one flattened section are auto-folded into a per-page
# folder (titled by the page H1) with one labelled leaf per source. mto-docs'
# own leaf is labelled with `site_title` (defaults to the mkdocs site_name).
# This path stays in the code for any mapping that isn't labelled, but every
# untitled flatten mapping below now carries `label: true`, so this folding is
# currently unused and `site_title` only matters again if a mapping stops
# being labelled.
#
# A mapping with `label: true` (flatten mappings only) groups that operator's
# pages under a header titled with the operator's `title`. The header is a plain
# label, not a clickable folder, and its pages sit at the same indent as MTO's.
# Labelled pages are never auto-folded as duplicates since the header already
# says which operator they came from. `label` and `title` are mutually exclusive.
site_title: "Tenant Operator"
operators:
  - title: Template Operator
    repo: https://github.com/stakater/template-operator-docs.git
    # branch: added-concepts            # optional; empty -> the repo's default branch
    # links to pages NOT whitelisted below fall back to this published site
    live_url: https://docs.stakater.com/template-operator-docs/
    live_url_style: directory
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "concepts"                # (architecture/terminology excluded below)
        under: "Concepts"
        flatten: true
        label: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "API Reference"
        title: "Template Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the Guides section
        into: "guides"
        under: "Guides"
        flatten: true
        label: true
      - from: "images/**"
        into: "images"          # assets only, no menu entry
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page

  - title: Hibernation Operator
    repo: https://github.com/stakater/hibernation-operator-docs.git
    # branch: added-concepts            # optional; empty -> the repo's default branch
    live_url: https://docs.stakater.com/hibernation-operator-docs/
    live_url_style: html          # sub-op uses use_directory_urls: false
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "concepts"                # (architecture/terminology excluded below)
        under: "Concepts"
        flatten: true
        label: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "API Reference"
        title: "Hibernation Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the Guides section
        into: "guides"
        under: "Guides"
        flatten: true
        label: true
      - from: "integrations/**"        # merged flat into the Integrations section
        into: "integrations"
        under: "Integrations"
        flatten: true
        label: true
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page
