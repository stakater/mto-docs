# Controls which sub-operator docs are merged into mto-docs at build time.
# `repo` is the canonical source (git URL); the pipeline clones it and the
# merge runs against the clone via --set-repo. Locally, override with --set-repo
# (see the Makefile) to point at a local checkout.
#
# mto-docs is organised by capability pillar (Multi-Tenancy, Templates, FinOps,
# Hibernation, Extensions), each with an Overview / Concepts / Guides triple.
# A sub-operator's shared sections therefore map into its own pillar, not into
# one flat Concepts or Guides section: `into` is the content path and `under` is
# the nav path, e.g. concepts/** -> templates/concepts under "Templates/Concepts".
# `under` must be a path here — five pillars each own a section called Concepts
# and a section called Guides, so a bare title would be ambiguous. Levels below
# the first are created if the pillar does not declare them in mkdocs.yml.
#
# Administration pages are deliberately NOT merged: they describe running a
# sub-operator standalone, which does not apply when it is installed as part of
# MTO. See content/administration/ for the hosted-together responsibilities.
#
# Duplicate pages (same filename from mto-docs + a sub-operator, or across
# sub-operators) under one flattened section are auto-folded into a per-page
# folder (titled by the page H1) with one labelled leaf per source. mto-docs'
# own leaf is labelled with `site_title` (defaults to the mkdocs site_name).
site_title: "Tenant Operator"
operators:
  - title: Template Operator
    repo: https://github.com/stakater/template-operator-docs.git
    # branch: main             # optional; empty -> the repo's default branch
    # links to pages NOT whitelisted below fall back to this published site
    live_url: https://docs.stakater.com/template-operator-docs/
    live_url_style: directory
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "templates/concepts"      # (architecture/terminology excluded below)
        under: "Templates/Concepts"
        flatten: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "Reference/API Reference"
        title: "Template Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the pillar's Guides
        into: "templates/guides"
        under: "Templates/Guides"
        flatten: true
      - from: "images/**"
        into: "images"          # assets only, no menu entry
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page
      - "administration/**"             # standalone-only, see content/administration/

  - title: Hibernation Operator
    repo: https://github.com/stakater/hibernation-operator-docs.git
    # branch: main            # optional; empty -> the repo's default branch
    live_url: https://docs.stakater.com/hibernation-operator-docs/
    live_url_style: html          # sub-op uses use_directory_urls: false
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "hibernation/concepts"    # (architecture/terminology excluded below)
        under: "Hibernation/Concepts"
        flatten: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "Reference/API Reference"
        title: "Hibernation Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the pillar's Guides
        into: "hibernation/guides"
        under: "Hibernation/Guides"
        flatten: true
      - from: "integrations/**"         # hibernating alongside other systems
        into: "hibernation/guides"
        under: "Hibernation/Guides"
        flatten: true
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page
      - "administration/**"             # standalone-only, see content/administration/
