# Controls which sub-operator docs are merged into mto-docs at build time.
# `repo` is the canonical source (git URL); the pipeline clones it and the merge
# runs against the clone via --set-repo. Locally override with --set-repo.
# `docs_dir` (default `content`) is the docs root inside that repo; `from` globs
# are relative to it. Merged files land in mto-docs' own docs_dir (mkdocs.yml).
#
# Product-first: each operator fills its own nav placeholder section (declared
# empty in theme_override/mkdocs.yml) with Overview/Concepts/Guides sub-sections.
# A placeholder may be nested (Templates > v2); its name must be unique
# in the nav, since the lookup takes the first match. `site_title` labels mto-docs'
# own section in the joined API page.
site_title: "Tenant Operator"

operators:
  - title: Templates v2
    section: "v2"
    slug: template-operator-v2
    repo: https://github.com/stakater/template-operator-v2-docs.git
    docs_dir: content                # docs root inside the repo, e.g. doc/content/my-docs
    live_url: https://docs.stakater.com/template-operator-v2-docs/
    live_url_style: directory
    mappings:
      - from: "about/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "how-to-guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        heading: "Template Operator v2"
      # template-operator-v2-docs has no images/ directory, so no images mapping here
    exclude:
      - "**/.gitkeep"

  - title: Templates
    section: "v1 – Legacy"
    slug: template-operator          # avoid mkdocs' reserved top-level /templates/ dir
    repo: https://github.com/stakater/template-operator-docs.git
    docs_dir: content
    live_url: https://docs.stakater.com/template-operator-docs/
    live_url_style: directory
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      # concatenated onto mto's own reference/api.src.md; the result,
      # reference/api.md, is generated and gitignored
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        under: "Reference"
        as: "API Reference"
        heading: "Template Operator v1 – Legacy"
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy

  - title: FinOps
    section: "FinOps"
    repo: https://github.com/stakater/finops-docs.git
    docs_dir: content
    live_url: https://docs.stakater.com/finops-docs/
    live_url_style: directory
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        heading: "FinOps Operator"
      # finops-docs has no images/ directory, so no images mapping here
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy

  - title: Hibernation
    section: "Hibernation"
    repo: https://github.com/stakater/hibernation-operator-docs.git
    docs_dir: content
    live_url: https://docs.stakater.com/hibernation-operator-docs/
    live_url_style: html
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        heading: "Hibernation Operator"
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy
