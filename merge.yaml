# Controls which sub-operator docs are merged into mto-docs at build time.
# `repo` is the canonical source (git URL); the pipeline clones it and the
# merge runs against the clone via --set-repo. Locally, override with --set-repo
# (see the Makefile) to point at a local checkout.
#
# mto-docs now follows the shared structure (structure.md), so `into`/`under`
# map 1:1 to the shared sections (guides->Guides, reference->Reference, ...).
operators:
  - title: Template Operator
    repo: https://github.com/stakater/template-operator-docs.git
    branch: added-concepts            # optional; empty -> the repo's default branch
    # links to pages NOT whitelisted below fall back to this published site
    live_url: https://docs.stakater.com/template-operator-docs/
    live_url_style: directory
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "concepts"                # (architecture/terminology excluded below)
        under: "Concepts"
        flatten: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "API Reference"
        title: "Template Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the Guides section
        into: "guides"
        under: "Guides"
        flatten: true
      - from: "images/**"
        into: "images"          # assets only, no menu entry
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page

  - title: Hibernation Operator
    repo: https://github.com/stakater/hibernation-operator-docs.git
    branch: added-concepts            # optional; empty -> the repo's default branch
    live_url: https://docs.stakater.com/hibernation-operator-docs/
    live_url_style: html          # sub-op uses use_directory_urls: false
    mappings:
      - from: "concepts/**"             # per-resource concept pages, merged flat
        into: "concepts"                # (architecture/terminology excluded below)
        under: "Concepts"
        flatten: true
      - from: "reference/api.md"        # single file, one custom-named entry
        into: "reference/api"
        under: "API Reference"
        title: "Hibernation Operator"
        flatten: true
      - from: "guides/**"               # merged flat into the Guides section
        into: "guides"
        under: "Guides"
        flatten: true
      - from: "integrations/**"        # merged flat into the Integrations section
        into: "integrations"
        under: "Integrations"
        flatten: false
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # MTO owns the shared Architecture page
      - "concepts/terminology.md"       # MTO owns the shared Terminology page
