# Controls which sub-operator docs are merged into mto-docs at build time.
# `repo` is the canonical source (git URL); the pipeline clones it and the merge
# runs against the clone via --set-repo. Locally override with --set-repo.
#
# Product-first: each operator fills its own top-level nav placeholder section
# (declared empty in theme_override/mkdocs.yml) with Overview/Concepts/Guides
# sub-sections. `site_title` labels mto-docs' own section in the joined API page.
site_title: "Tenant Operator"

operators:
  - title: Templates
    section: "Templates"
    slug: template-operator          # avoid mkdocs' reserved top-level /templates/ dir
    repo: https://github.com/stakater/template-operator-docs.git
    live_url: https://docs.stakater.com/template-operator-docs/
    live_url_style: directory
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"          # concatenated into the single API page
        concat_into: "reference/api.md"
        under: "Reference"
        as: "API Reference"
        heading: "Template Operator"
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy

  - title: FinOps
    section: "FinOps"
    repo: https://github.com/stakater/finops-docs.git
    live_url: https://docs.stakater.com/finops-docs/
    live_url_style: directory
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        heading: "FinOps"
      # finops-docs has no images/ directory, so no images mapping here
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy

  - title: Hibernation
    section: "Hibernation"
    repo: https://github.com/stakater/hibernation-operator-docs.git
    live_url: https://docs.stakater.com/hibernation-operator-docs/
    live_url_style: html
    mappings:
      - from: "overview/**"
        into: "overview"
        under: "Overview"
      - from: "concepts/**"
        into: "concepts"
        under: "Concepts"
      - from: "guides/**"
        into: "guides"
        under: "Guides"
      - from: "reference/api.md"
        concat_into: "reference/api.md"
        heading: "Hibernation Operator"
      - from: "images/**"
        into: "images"
    exclude:
      - "**/.gitkeep"
      - "concepts/architecture.md"      # shared Architecture lives in Multi-Tenancy
      - "concepts/terminology.md"       # shared Terminology lives in Multi-Tenancy
